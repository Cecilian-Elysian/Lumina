<!DOCTYPE html>
<!--
  ============================================================
  流动图片墙 (Lumina) — 页面骨架
  ------------------------------------------------------------
  结构说明：
    header    → 标题区（网站名称 + 副标题）
    main#wall → 图片墙容器（多行叠层轨道，由 js/main.js 动态生成）
    footer    → 页脚（图片来源/版权说明）
    #lightbox → 灯箱预览（默认隐藏，点击图片后弹出大图）

  脚本加载顺序（有依赖，不能颠倒）：
    1. js/config.js → 先定义全局配置对象 CONFIG
    2. js/main.js   → 后读取 CONFIG 并渲染页面
  ============================================================
-->
<html lang="zh-CN">
<head>
  <!-- 字符编码：必须放在最前，保证中文正常显示 -->
  <meta charset="UTF-8">
  <!-- 视口设置：让手机端按设备宽度渲染，禁用缩放抖动 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 页面描述（利于 SEO / 分享摘要） -->
  <meta name="description" content="流动图片墙 — 多行叠层水平流动的图片展示墙">
  <!-- 浏览器标签页标题 -->
  <title>流动图片墙 · Lumina</title>
  <!-- 外部样式表 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========== 标题区 ========== -->
  <header class="site-header">
    <!-- 主标题：serif 字体提升质感（样式在 css 中控制） -->
    <h1 class="site-title">流动图片墙</h1>
    <!-- 副标题：简要说明站点功能 -->
    <p class="site-subtitle">多行叠层 · 水平流动 · 点击预览</p>
  </header>

  <!--
    ========== 图片墙主容器 ==========
    内部由 JS 按 CONFIG.rows 生成若干 .row（每一行一个滚动轨道），
    HTML 中保持为空即可。
  -->
  <main id="wall" class="wall" aria-label="流动图片墙">
    <!-- 数据加载时的占位提示（JS 加载完成后会自动移除） -->
    <p id="loading" class="loading">正在加载图片…</p>
  </main>

  <!-- ========== 页脚 ========== -->
  <footer class="site-footer">
    <p>图片来自图床 · <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a> · Cloudflare Pages 托管</p>
  </footer>

  <!--
    ========== 灯箱（大图预览） ==========
    role="dialog" + aria-modal  → 告诉屏幕阅读器这是模态对话框
    .hidden 类控制显隐（样式在 css 中定义）
    内部元素：
      #lb-img     → 大图本体
      #lb-caption → 底部说明文字（序号 + 图片名）
      #lb-close   → 右上角关闭按钮
      #lb-prev    → 左侧"上一张"箭头
      #lb-next    → 右侧"下一张"箭头
  -->
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="图片预览">
    <!-- 关闭按钮：aria-label 供屏幕阅读器朗读按钮用途 -->
    <button id="lb-close" class="lb-btn lb-close" aria-label="关闭预览" title="关闭 (Esc)">&#215;</button>
    <!-- 上一张箭头（&#8249; 是 ‹ 字符） -->
    <button id="lb-prev" class="lb-btn lb-prev" aria-label="上一张" title="上一张 (&#8592;)">&#8249;</button>
    <!-- 大图：alt 由 JS 动态填入图片名 -->
    <img id="lb-img" class="lb-img" alt="">
    <!-- 下一张箭头 -->
    <button id="lb-next" class="lb-btn lb-next" aria-label="下一张" title="下一张 (&#8594;)">&#8250;</button>
    <!-- 底部说明：显示 "3 / 60" 计数与图片名 -->
    <p id="lb-caption" class="lb-caption"></p>
  </div>

  <!-- 配置文件必须先于主逻辑加载（main.js 依赖全局 CONFIG） -->
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
